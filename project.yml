name: Adder
options:
  bundleIdPrefix: ai.thinkun
  deploymentTarget:
    iOS: '17.0'
packages:
  ZeticMLangeiOS:
    url: https://github.com/zetic-ai/ZeticMLangeiOS.git
    exactVersion: 1.11.0
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1'
    CODE_SIGN_STYLE: Automatic
targets:
  Adder:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: ZeticMLangeiOS
        product: ZeticMLange
      - sdk: Accelerate.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.thinkun.localadder
        INFOPLIST_KEY_CFBundleDisplayName: Adder
        DEVELOPMENT_TEAM: QN4D3JSD6H
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    postBuildScripts:
      - name: Embed private development SDK configuration
        script: python3 "$SRCROOT/scripts/embed-local-key.py"
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/MelangeConfig.plist
    info:
      path: App/Info.plist
      properties:
        UILaunchScreen: {}
        NSMicrophoneUsageDescription: Record a short note for local Whisper transcription.
        NSContactsUsageDescription: Save the people you review to your Contacts.
        NSCalendarsWriteOnlyAccessUsageDescription: Add the meetings you review to Calendar.
        NSRemindersFullAccessUsageDescription: Create preparation reminders for the meetings you review.
        NSCameraUsageDescription: Capture people, posters and other information to add with context.
        NSLocationWhenInUseUsageDescription: Add real capture coordinates to the items you review and save.
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
